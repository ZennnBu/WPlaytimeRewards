  update-interval: 60
  save-interval: 300

gui:
  title: "&8Playtime Rewards"
  size: 27

rewards:
  10minutes:
    display-name: "&a10 Minutes Reward"
    slot: 10
    required-minutes: 10
    money: 100
    message: "&aYou claimed 10 minutes reward!"

  30minutes:
    display-name: "&e30 Minutes Reward"
    slot: 12
    required-minutes: 30
    money: 300
    message: "&aYou claimed 30 minutes reward!"

  1hour:
    display-name: "&61 Hour Reward"
    slot: 14
    required-minutes: 60
    money: 500
